<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sawyer Family Pantry</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f6f0e5;
  color: #3e4638;
}

header {
  background: #66745a;
  color: white;
  padding: 28px 15px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-family: Georgia, serif;
  font-size: 34px;
}

header p {
  margin: 8px 0 0;
  font-size: 17px;
}

main {
  max-width: 700px;
  margin: auto;
  padding: 18px;
}

.card {
  background: #fffdf8;
  border-radius: 18px;
  padding: 20px;
  margin-bottom: 18px;
  box-shadow: 0 4px 12px rgba(0,0,0,.08);
}

h2 {
  margin-top: 0;
  font-family: Georgia, serif;
  color: #59654e;
  font-size: 28px;
}

.locations {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 11px;
}

.location {
  background: #e8dfcf;
  padding: 15px 8px;
  border-radius: 13px;
  text-align: center;
  font-weight: bold;
  cursor: pointer;
  border: 2px solid transparent;
}

.location.active {
  border-color: #66745a;
  background: #dbe1d3;
}

button {
  border: none;
  border-radius: 11px;
  padding: 12px;
  font-size: 16px;
  cursor: pointer;
}

.addButton {
  width: 100%;
  background: #66745a;
  color: white;
  font-weight: bold;
  margin-top: 7px;
}

input, select {
  width: 100%;
  padding: 12px;
  margin: 7px 0;
  border: 1px solid #c9c1b
