<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sawyer Family Pantry</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f6f0e5;
      color: #3e4638;
    }

    header {
      background: #66745a;
      color: white;
      padding: 25px 15px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
    }

    header p {
      margin: 8px 0 0;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 18px;
    }

    .card {
      background: white;
      border-radius: 15px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    }

    h2 {
      margin-top: 0;
      color: #66745a;
    }

    label {
      display: block;
      margin-top: 12px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      border: 1px solid #c9c2b6;
      border-radius: 9px;
      font-size: 16px;
    }

    button {
      border: none;
      border-radius: 9px;
      padding: 11px 14px;
      font-size: 15px;
      cursor: pointer;
    }

    .add-button {
      width: 100%;
      margin-top: 16px;
      background: #66745a;
      color: white;
      font-weight: bold;
    }

    .inventory-item {
      border-top: 1px solid #eee7dc;
      padding: 14px 0;
    }

    .inventory-item:first-child {
      border-top: none;
    }

    .item-name {
      font-size: 18px;
      font-weight: bold;
    }

    .item-info {
      margin: 5px 0 10px;
      color: #6b6b63;
      font-size: 14px;
    }

    .controls {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .minus {
      background: #b66b5c;
      color: white;
    }

    .plus {
      background: #66745a;
      color: white;
    }

    .delete {
      background: #ddd5c8;
      color: #4b463f;
      margin-left: auto;
    }

    .quantity {
      font-weight: bold;
      min-width: 35px;
      text-align: center;
    }

    .empty {
      text-align: center;
      color: #888;
      padding: 15px;
    }

    .total {
      background: #eee6d8;
      border-radius: 10px;
      padding: 12px;
      margin-top: 12px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<header>
  <h1>🌿 Sawyer Family Pantry</h1>
  <p>Farmhouse pantry & freezer inventory</p>
</header>

<div class="container">

  <div class="card">
    <h2>Add Food</h2>

    <label for="itemName">Food Item</label>
    <input id="itemName" type="text" placeholder="Example: Eggs">

    <label for="location">Where is it?</label>
    <select id="location">
      <option>Kitchen Fridge</option>
      <option>Kitchen Freezer</option>
      <option>Beef Chest Freezer</option>
      <option>Pork Chest Freezer</option>
      <option>Second Fridge</option>
      <option>Second Freezer</option>
      <option>Pantry</option>
      <option>Fruit & Vegetable Shelf</option>
    </select>

    <label for="quantity">Quantity</label>
    <input id="quantity" type="number" min="1" value="1">

    <label for="cost">Cost ($)</label>
    <input id="cost" type="number" min="0" step="0.01" placeholder="0.00">

    <button class="add-button" onclick="addItem()">Add to Pantry</button>
  </div>

  <div class="card">
    <h2>My Inventory</h2>
    <div id="inventory"></div>
    <div class="total" id="totalValue">Total inventory value: $0.00</div>
  </div>

</div>

  let pantry = JSON.parse(localStorage.getItem("sawyerPantry")) || [];
